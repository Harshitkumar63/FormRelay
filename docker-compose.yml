version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: formrelay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: formrelay
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: formrelay
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formrelay -d formrelay"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: formrelay-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://formrelay:changeme@db:5432/formrelay
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-for-formrelay-prod}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: formrelay-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
