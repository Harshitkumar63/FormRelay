name: FormRelay CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Pytest & Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install . pytest httpx alembic

      - name: Run Alembic migration check
        working-directory: ./backend
        run: |
          alembic upgrade head

      - name: Run backend pytest suite
        working-directory: ./backend
        run: |
          pytest -v

  frontend-tests:
    name: Frontend Lint, Build & Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build TypeScript & Vite bundle
        working-directory: ./frontend
        run: npm run build

      - name: Run Vitest test suite
        working-directory: ./frontend
        run: npm test
